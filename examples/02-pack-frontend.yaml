# Pack + domain-application + frontend (extensiones del pack).
# Handoff: Specification → Architecture → domain-application → frontend
#                                                    ↘ testing-review ↗

sdaf:
  version: "0.2.0"

project:
  name: MiProyecto
  language: es

stack:
  pack: sdaf-stack-dotnet@0.1.1
  src_path: src
  tests_path: tests

agents:
  active:
    - specification
    - architecture
    - domain-application
    - frontend
    - testing-review
  stubs:
    - product
    - domain
    - application
    - infrastructure
    - devops
    - review
    - testing
    - ai
  fusions:
    testing-review: [testing, review]
    domain-application: [domain, application]

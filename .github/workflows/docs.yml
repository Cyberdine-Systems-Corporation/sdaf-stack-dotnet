name: docs

# Homogéneo con sdaf-core/.github/workflows/docs-deploy.yml:
# - push a main  → mike alias "dev"  → …/sdaf-stack-dotnet/dev/
# - tag vX.Y.Z   → versión + "latest" (default)
# - PR           → solo build --strict (sin publicar), en todo PR: el sitio
#                  sirve la raíz del repo (README, CHANGELOG, pack.yaml…)
# - workflow_dispatch → redeploy "dev" desde main
# Acciones fijadas por SHA (comentario = versión); dependabot propone subidas.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Mínimo privilegio: solo el job deploy escribe (mike --push a gh-pages).
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements-docs.txt

      - name: Build estricto (warnings -> error)
        run: mkdocs build -f mkdocs/mkdocs.yml --strict

  deploy:
    needs: build
    if: >
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # mike necesita historial de gh-pages

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements-docs.txt

      - name: Configurar git para mike
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Deploy versión de desarrollo (main / workflow_dispatch)
        if: github.ref == 'refs/heads/main'
        run: mike deploy -F mkdocs/mkdocs.yml --push --update-aliases dev

      - name: Deploy versión de release (tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(echo "${GITHUB_REF_NAME}" | sed -E 's/^v([0-9]+\.[0-9]+).*/\1/')
          mike deploy -F mkdocs/mkdocs.yml --push --update-aliases "$VERSION" latest
          mike set-default -F mkdocs/mkdocs.yml --push latest

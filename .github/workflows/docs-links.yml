name: Docs links

on:
  push:
    paths:
      - '**/*.md'
      - 'scripts/check-md-links.ps1'
      - '.github/workflows/docs-links.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-md-links.ps1'
      - '.github/workflows/docs-links.yml'

jobs:
  check-md-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate relative Markdown links
        shell: pwsh
        run: ./scripts/check-md-links.ps1

name: validate

# Acciones fijadas por SHA (comentario = versión); dependabot propone subidas.
# sdaf-core fijado a v0.4.2 (581d4ee), la línea de compat de pack.yaml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # diff contra la base: historial solo crece
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install pyyaml jsonschema
      - name: Coherencia del pack (pack.yaml, cabeceras, historial, citas, examples, ADRs)
        run: python scripts/check-pack-metadata.py
      - name: Autocomprobación del checker (mutaciones)
        run: python scripts/test-check-pack-metadata.py
      - name: Historial y CHANGELOG solo crecen
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python scripts/check-history-append-only.py --base "$BASE_REF"

  core-validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: examples/ contra schema e invariantes de sdaf-core (I4 estricto)
        uses: Cyberdine-Systems-Corporation/sdaf-core/.github/actions/validate-sdaf@581d4ee2d6f7a396d48951bb1f560a426c07307c # v0.4.2
        with:
          config-paths: examples/*.yaml
          check-worklog: "false"
          strict-i4: "true"
      - name: Checkout de sdaf-core v0.4.2 (validador de worklog)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Cyberdine-Systems-Corporation/sdaf-core
          ref: 581d4ee2d6f7a396d48951bb1f560a426c07307c # v0.4.2
          path: .sdaf-core
      - name: Validar worklogs del pack con el schema del core
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(worklogs/**/*.md)
          if [ ${#files[@]} -gt 0 ]; then python .sdaf-core/scripts/validate-worklog.py "${files[@]}"; fi

# Enlaces y markdownlint viven en docs-links.yml (nombre citado en el CHANGELOG publicado).
